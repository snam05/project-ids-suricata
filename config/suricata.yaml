%YAML 1.1
---
# Cấu hình chính của lab. Chạy Suricata từ thư mục gốc của repo.
default-log-dir: results
default-rule-path: rules
rule-files:
  - local.rules
# Ngưỡng phát hiện nằm trong rules/local.rules.
threshold-file: /dev/null

vars:
  address-groups:
    HOME_NET: "[10.10.10.0/24]"
    EXTERNAL_NET: "!$HOME_NET"
    LAB_CLIENT: "10.10.10.10"
    LAB_SERVER: "10.10.10.20"

app-layer:
  protocols:
    http:
      enabled: yes
    dns:
      tcp:
        enabled: yes
        detection-ports:
          dp: 53
      udp:
        enabled: yes
        detection-ports:
          dp: 53

unix-command:
  enabled: no

pcap-file:
  continuous: false
  delete-when-done: false

logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes

stats:
  enabled: yes

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert
        - http
        - dns
        - flow
        - stats
