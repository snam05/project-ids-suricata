# server block mẫu. Dùng trong http{} của nginx, không thay toàn bộ
# nginx.conf hệ thống. TODO: thay listen bằng IP private thực tế, nginx -t.
server {
    listen 10.10.10.20:80;
    server_name _;
    default_type text/plain;
    location / {
        return 200 "ids-lab reference service\n";
    }
}
